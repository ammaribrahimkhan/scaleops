<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScaleOps</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
    .queued { color: #b36b00; }
    .done { color: #1a7f37; }
    #error { color: #b00020; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>ScaleOps</h1>
  <div class="meta">
    API pod: <b id="pod">-</b> · version: <b id="version">-</b> · queue length: <b id="queue">-</b>
  </div>

  <form id="form">
    <input id="name" placeholder="Job name" maxlength="100" required />
    <button type="submit">Submit job</button>
  </form>
  <div id="error"></div>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const $ = (id) => document.getElementById(id);

    async function refresh() {
      try {
        const [info, queue, items] = await Promise.all([
          fetch('/api/info').then((r) => r.json()),
          fetch('/api/queue').then((r) => r.json()),
          fetch('/api/items').then((r) => r.json()),
        ]);
        $('pod').textContent = info.pod;
        $('version').textContent = info.version;
        $('queue').textContent = queue.length;
        $('rows').innerHTML = items.items
          .map((i) => `<tr><td>${i.id}</td><td></td><td class="${i.status}">${i.status}</td></tr>`)
          .join('');
        const cells = $('rows').querySelectorAll('tr');
        items.items.forEach((i, idx) => {
          cells[idx].children[1].textContent = i.name;
        });
        $('error').textContent = '';
      } catch (e) {
        $('error').textContent = 'Cannot reach API';
      }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = $('name').value.trim();
      if (!name) return;
      try {
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!res.ok) throw new Error();
        $('name').value = '';
        refresh();
      } catch (err) {
        $('error').textContent = 'Failed to submit job';
      }
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
