apiVersion: v1
kind: ConfigMap
metadata:
  name: scaleops-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  scaleops-overview.json: |
    {
      "title": "ScaleOps Overview",
      "uid": "scaleops-overview",
      "tags": ["scaleops"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "API pods ready",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"scaleops\",deployment=\"api\"}" }
          ]
        },
        {
          "id": 2, "type": "stat", "title": "API pods desired by HPA",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"scaleops\",horizontalpodautoscaler=\"api\"}" }
          ]
        },
        {
          "id": 3, "type": "stat", "title": "Worker pods ready",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=\"scaleops\",deployment=\"worker\"}" }
          ]
        },
        {
          "id": 4, "type": "stat", "title": "API error rate (5xx)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent", "noValue": "0" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total{job=\"api\",status=\"5xx\"}[1m])) / sum(rate(http_requests_total{job=\"api\"}[1m])) * 100" }
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "API request rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "requests/s", "expr": "sum(rate(http_requests_total{job=\"api\",handler!~\"/metrics|/healthz|/readyz\"}[1m]))" }
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "API p95 latency",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "p95", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"api\"}[1m])))" }
          ]
        },
        {
          "id": 7, "type": "timeseries", "title": "API CPU usage per pod (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{pod}}", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"scaleops\",pod=~\"api-.*\",container=\"api\"}[1m]))" }
          ]
        },
        {
          "id": 8, "type": "timeseries", "title": "API replicas: current vs desired vs max",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "current", "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"scaleops\",horizontalpodautoscaler=\"api\"}" },
            { "refId": "B", "legendFormat": "desired", "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"scaleops\",horizontalpodautoscaler=\"api\"}" },
            { "refId": "C", "legendFormat": "max", "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"scaleops\",horizontalpodautoscaler=\"api\"}" }
          ]
        },
        {
          "id": 9, "type": "timeseries", "title": "Memory per pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{pod}}", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"scaleops\",container!=\"\",container!=\"POD\"})" }
          ]
        },
        {
          "id": 10, "type": "timeseries", "title": "Container restarts",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{pod}}", "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"scaleops\"})" }
          ]
        },
        {
          "id": 11, "type": "logs", "title": "ScaleOps logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 28 },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            { "refId": "A", "expr": "{namespace=\"scaleops\"}" }
          ]
        }
      ]
    }