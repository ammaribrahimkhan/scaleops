apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scaleops-alerts
  namespace: monitoring
  labels:
    app: scaleops
spec:
  groups:
    - name: scaleops.api
      rules:
        - alert: ApiDown
          expr: absent(up{job="api"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "No API pod is being scraped successfully"
            description: "Prometheus has seen no healthy API target for 1 minute."

        - alert: ApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="api",status="5xx"}[2m]))
            /
            sum(rate(http_requests_total{job="api"}[2m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "API 5xx error rate above 5%"
            description: "More than 5% of API requests have failed for 2 minutes."

        - alert: ApiHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="api"}[2m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "API p95 latency above 500ms"
            description: "The 95th percentile API latency has been above 500ms for 5 minutes."

        - alert: ScaleOpsPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="scaleops"}[10m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting repeatedly"
            description: "Container {{ $labels.container }} restarted more than twice in 10 minutes."

        - alert: ApiAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="scaleops",horizontalpodautoscaler="api"}
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="scaleops",horizontalpodautoscaler="api"}
          for: 3m
          labels:
            severity: info
          annotations:
            summary: "API autoscaler is at its maximum replicas"
            description: "The API HPA has been at maxReplicas for 3 minutes; more load will not scale further."